name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/code   # Model.py, tests/ live here

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v

  deploy:
    needs: test                       # Only runs if unit tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                  # Dockerfile is at repo root
          push: true
          tags: imtiaz3445/car-price-app-v2:v3

      - name: Deploy to VM via Native SSH Jump Host
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Configure SSH to bypass host key verification globally for both jump host and target
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

          # Execute remote deployment via jump host (-T disables pseudo-terminal allocation)
          ssh -T -i ~/.ssh/id_ed25519 -J ${VM_USER}@bazooka.cs.ait.ac.th ${VM_USER}@${VM_HOST} << 'EOF'
            docker pull imtiaz3445/car-price-app-v2:v3
            docker stop car-price-app || true
            docker rm car-price-app || true
            docker run -d --name car-price-app -p 8050:8050 imtiaz3445/car-price-app-v2:v3
          EOF
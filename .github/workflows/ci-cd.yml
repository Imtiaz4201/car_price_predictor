name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/code   # Model.py, requirements.txt, tests/ live here[cite: 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v

  deploy:
    needs: test                       # Only runs if unit tests pass[cite: 3]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                  # Dockerfile is at repo root[cite: 3]
          push: true
          tags: imtiaz3445/car-price-app-v2:latest

      - name: Deploy to VM via SSH (via Bazooka Jump Host)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}            # ml.brain.cs.ait.ac.th
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          proxy_host: bazooka.cs.ait.ac.th       # Jump host server
          proxy_username: ${{ secrets.VM_USER }}
          proxy_key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull imtiaz3445/car-price-app-v2:latest
            docker stop car-price-app || true
            docker rm car-price-app || true
            docker run -d --name car-price-app -p 8050:8050 imtiaz3445/car-price-app-v2:latest
name: Car Price App CI/CD

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:


jobs:

  # ============================================================
  # 1. TEST
  # ============================================================

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -v


  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build-and-push:
    name: Build and Push Docker Image
    needs: test

    # Only build/push on a push to main
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-app-v2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-app-v2:${{ github.sha }}


  # ============================================================
  # 3. DEPLOY ON AIT SERVER
  # ============================================================

  deploy:
    name: Deploy to AIT Server

    needs: build-and-push

    if: github.event_name == 'push'

    # Your ml-brain self-hosted runner
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show server information
        run: |
          echo "Deploying on:"
          hostname

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Docker Compose:"
          docker compose version

      - name: Pull latest Docker image
        run: |
          docker compose pull

      - name: Stop and recreate application
        run: |
          docker compose up -d --remove-orphans

      - name: Show running containers
        run: |
          docker compose ps